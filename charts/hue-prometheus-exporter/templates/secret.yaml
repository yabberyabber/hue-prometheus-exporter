{{- if and (not .Values.applicationKey.existingSecret) .Values.applicationKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hpe.name" . }}
  labels:
    {{- include "hpe.labels" . | nindent 4 }}
type: Opaque
stringData:
  application-key: {{ .Values.applicationKey.value | quote }}
{{- end }}
